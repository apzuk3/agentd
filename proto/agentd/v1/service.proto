syntax = "proto3";

package agentd.v1;

option go_package = "github.com/apzuk3/agentd/gen/proto/go/agentd/v1;agentdv1";

import "agentd/v1/types.proto";
import "google/protobuf/struct.proto";

service AgentdService {
  rpc Run(stream RunRequest) returns (stream RunResponse);
}

message RunRequest {
  message Run {
    Agent agent = 1;
    string user_id = 2;
    optional string session_id = 3;
    string user_prompt = 4;
    repeated Tool tools = 5;
    google.protobuf.Struct initial_state = 6;
  }

  message Heartbeat {

  }

  message ToolcallResult {
    string session_id = 1;
    string tool_call_id = 2;
    string tool_name = 3;
    optional string result = 4;
    optional string error = 5;
  }

  // either cancel tool call or end session
  message Cancel {
    optional string tool_call_id = 2;
  }

  oneof request {
    Run run = 1;
    Heartbeat heartbeat = 2;
    ToolcallResult toolcall_result = 3;
    Cancel cancel = 5;
  }
}

message RunResponse {
  message Run {
    string session_id = 1;
  }

  message Heartbeat { }

  message ToolcallRequest {
    string tool_call_id = 1;
    string tool_name = 2;
    string tool_input = 3;
    repeated string agent_path = 4;
  }

  message OutputChunk {
    string tool_call_id = 1;
    repeated string agent_path = 2;
    string content = 3;
    bool last = 4; // true when this is the final chunk from the agent identified by agent_path
    bool is_thought = 5; // true when the content is model thinking rather than final response
  }

  message Error {
    ErrorCode code = 1;
    string message = 2;
    bool retryable = 3;
  }

  message End {
    optional string reason = 1;
    UsageSummary usage_summary = 2;
    bool completed = 3; // true if the agent tree finished naturally; false if client-initiated end
  }

  message StateUpdate {
    google.protobuf.Struct state_delta = 1;
  }

  oneof response {
    Run run = 1;
    Heartbeat heartbeat = 2;
    ToolcallRequest toolcall_request = 3;
    Error error = 4;
    End end = 5;
    OutputChunk output_chunk = 6;
    StateUpdate state_update = 7;
  }
}
